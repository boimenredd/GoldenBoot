<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLS Top Goalscorers Builder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0e0e0e;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;padding:20px;color:#fff}
h1{font-size:15px;font-weight:700;color:#777;margin-bottom:2px}
.sub{font-size:11px;color:#2e2e2e;margin-bottom:14px}
.topbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sv{display:flex;align-items:center;gap:8px;background:#181818;border:1px solid #262626;border-radius:6px;padding:6px 12px}
.sv em{color:#3a3a3a;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-style:normal}
.sv input{background:none;border:none;color:#fff;font-size:14px;font-weight:800;width:52px;outline:none;font-family:inherit}
.xbtn{background:#0055ee;color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer}
.xbtn:hover{background:#0044cc}
.xbtn:disabled{background:#252525;color:#444;cursor:not-allowed}
.pgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:18px}
.pc{background:#141414;border:1px solid #1e1e1e;border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:5px}
.cbar{height:3px;border-radius:2px;margin-bottom:2px}
.plbl{color:#252525;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.pdrop{height:72px;background:#0a0a0a;border:1.5px dashed #1a1a1a;border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#1e1e1e;font-size:11px;cursor:pointer}
.pdrop:hover{border-color:#2e2e2e;color:#2e2e2e}
.pdrop img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.pc input[type=text],.pc input[type=number],.pc select{background:#0a0a0a;border:1px solid #181818;color:#aaa;border-radius:3px;padding:3px 5px;font-size:10px;width:100%;outline:none;font-family:inherit}
.pc input[type=number]{font-size:12px;font-weight:800;color:#fff}
.sr{display:flex;align-items:center;gap:4px}
.sr em{color:#222;font-size:9px;width:22px;flex-shrink:0;font-style:normal}
.ccr{display:none;align-items:center;gap:5px}
.ccr label{color:#252525;font-size:9px}
.pout{overflow-x:auto}
.pscale{transform-origin:top left}

/* ══════════════════════════════════════════════
   THE CARD  —  1568 × 782 px
   All values pixel-sampled from source image
   ══════════════════════════════════════════════
   
   HORIZONTAL LAYOUT:
   Left panel: 373px | soft right edge
   5 × player col: 235px each | 5px dividers rgb(125,128,128)

   VERTICAL LAYOUT:
   Photo area:  364px  (fills with team color bg)
   Photo→name border: 14px dark near-black  
   Name strip:  106px  bg=rgb(222,223,227)
   Main H-div:  13px   dark rgb(10,12,18)
   Goals row:   101px  label=rgb(200,203,214) cell=rgb(216,218,224)
   G/A div:     12px   rgb(181,184,194)
   Assists row: 106px  label=rgb(194,197,208) cell=rgb(207,209,220)
   A/G div:     19px   rgb(10,12,18) near-black
   Games row:   45px   label=rgb(189,193,204) cell=rgb(195,198,209)
   TOTAL: 364+14+106+13+101+12+106+19+45 = 780 ≈ 782
   ══════════════════════════════════════════════ */

#card{
  width:1568px;height:782px;overflow:hidden;
  display:flex;flex-direction:column;
  font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:rgb(205,206,211)
}

/* ── TOP SECTION = photo + name strip ── */
#top{display:flex;height:497px;flex-shrink:0}

#lp{
  width:373px;flex-shrink:0;
  background:rgb(205,206,211);
  border-right:4px solid rgb(168,172,178);
  display:flex;flex-direction:column;
  padding:20px 20px 24px 22px
}
#lp .sp{flex:1}
#lp img.logo{width:64px;height:auto;flex-shrink:0}
#lptitle{
  font-size:68px;font-weight:800;
  color:rgb(17,18,21);line-height:1.0;
  letter-spacing:-2px;margin-bottom:9px
}
#lpseason{font-size:26px;font-weight:400;color:rgb(17,18,21)}

/* Player columns in top section */
.pct{
  flex-shrink:0;display:flex;flex-direction:column;
  overflow:hidden;
  border-right:5px solid rgb(125,128,128)
}
.pct:last-child{border-right:none}

/* Photo area — team color bg */
.pph{
  height:364px;flex-shrink:0;overflow:hidden;
  border-bottom:14px solid rgb(12,14,18)
}
.pph img{width:100%;height:100%;object-fit:cover;object-position:center 5%;display:block}
.pph .bl{width:100%;height:100%}

/* Name strip */
.nms{
  flex:1;
  background:rgb(222,223,227);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 6px;text-align:center
}
.nms .fn{font-size:22px;font-weight:400;color:rgb(17,18,21);line-height:1.2}
.nms .ln{font-size:23px;font-weight:700;color:rgb(17,18,21);line-height:1.2}
.nms .tn{font-size:15px;font-weight:400;color:rgb(17,18,21);opacity:.55;margin-top:4px}

/* ── STAT ROWS ── */
.row{display:flex;flex-shrink:0}
#gr {height:101px;border-bottom:12px solid rgb(181,184,194)}
#ar {height:106px;border-bottom:19px solid rgb(12,14,18)}
#gpr{height:45px}

.lc{
  width:373px;flex-shrink:0;
  display:flex;align-items:center;padding-left:22px;
  border-right:4px solid rgb(168,172,178);
  font-size:34px;font-weight:300;color:rgb(17,18,21)
}
#gr  .lc{background:rgb(200,203,214)}
#ar  .lc{background:rgb(194,197,208)}
#gpr .lc{background:rgb(189,193,204)}

.nc{
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-right:5px solid rgb(125,128,128);
  font-weight:800;color:rgb(17,18,21);letter-spacing:-2px
}
.nc:last-child{border-right:none}
#gr  .nc{background:rgb(216,218,224);font-size:58px}
#ar  .nc{background:rgb(207,209,220);font-size:58px}
#gpr .nc{background:rgb(195,198,209);font-size:38px}

.snote{color:#1e1e1e;font-size:11px;text-align:center;margin-top:6px}
</style>
</head>

<script>
const T={"Inter Miami":"#F4A7BE","LAFC":"#C49A6C","Nashville SC":"#ECE83A","FC Cincinnati":"#F05323","New York City FC":"#6CACE4","Atlanta United":"#80000A","Austin FC":"#00B140","Charlotte FC":"#1A85C8","Chicago Fire":"#C0102B","Colorado Rapids":"#862633","Columbus Crew":"#FEDD00","D.C. United":"#231F20","FC Dallas":"#BF0D3E","Houston Dynamo":"#F4911E","LA Galaxy":"#00245D","Minnesota United":"#3A1777","CF Montreal":"#003DA5","New England Revolution":"#003087","New York Red Bulls":"#ED1E36","Orlando City":"#633492","Philadelphia Union":"#071B2C","Portland Timbers":"#004812","Real Salt Lake":"#B30838","San Jose Earthquakes":"#0D4C86","Seattle Sounders":"#5D9732","Sporting KC":"#002F6C","St. Louis City SC":"#C0102B","Toronto FC":"#B81137","Vancouver Whitecaps":"#9CCAE2","San Diego FC":"#003087","Custom":"#888888"};
const D=["Inter Miami","LAFC","Nashville SC","FC Cincinnati","New York City FC"];
function build(){
  const g=document.getElementById("pgrid");
  for(let i=0;i<5;i++){
    const c=T[D[i]];
    const opts=Object.keys(T).map(t=>`<option${t===D[i]?" selected":""}>${t}</option>`).join("");
    const d=document.createElement("div");d.className="pc";
    d.innerHTML=`<div class="cbar" id="cb${i}" style="background:${c}"></div><div class="plbl">Player ${i+1}</div><label class="pdrop"><span>&#128247; Photo</span><input type="file" accept="image/*" style="display:none" onchange="loadPhoto(${i},this)"></label><input type="text" placeholder="First name" oninput="setFN(${i},this.value)"><input type="text" placeholder="Last name (bold)" oninput="setLN(${i},this.value)"><input type="text" placeholder="Team label" oninput="setTN(${i},this.value)"><select onchange="setTeam(${i},this.value)">${opts}</select><div class="ccr" id="cc${i}"><label>Color:</label><input type="color" value="#888" oninput="setCC(${i},this.value)"></div><div class="sr"><em>Goals</em><input type="number" placeholder="-" oninput="setStat(${i},'g',this.value)"></div><div class="sr"><em>Ast</em><input type="number" placeholder="-" oninput="setStat(${i},'a',this.value)"></div><div class="sr"><em>GP</em><input type="number" placeholder="-" oninput="setStat(${i},'gp',this.value)"></div>`;
    g.appendChild(d);setBg(i,c);
  }
}
function loadPhoto(i,inp){if(!inp.files[0])return;const r=new FileReader();r.onload=e=>{document.getElementById("ph"+i).innerHTML=`<img src="${e.target.result}" alt="">`;};r.readAsDataURL(inp.files[0]);}
function setFN(i,v){document.getElementById("fn"+i).textContent=v}
function setLN(i,v){document.getElementById("ln"+i).textContent=v}
function setTN(i,v){document.getElementById("tn"+i).textContent=v}
function setBg(i,c){document.getElementById("cb"+i).style.background=c;document.getElementById("pct"+i).style.background=c;document.getElementById("bl"+i).style.background=c;}
function setTeam(i,t){const c=t==="Custom"?document.querySelector("#cc"+i+" input[type=color]").value:T[t];setBg(i,c);document.getElementById("cc"+i).style.display=t==="Custom"?"flex":"none";}
function setCC(i,c){setBg(i,c)}
function setStat(i,t,v){document.getElementById(t+i).textContent=v}
function setSeason(v){document.getElementById("lpseason").textContent=v+" Season"}
function scale(){
  const s=Math.min(1,(window.innerWidth-44)/1568);
  const sc=document.getElementById("scaler");
  sc.style.transform=`scale(${s})`;sc.style.width="1568px";sc.style.height="782px";
  document.querySelector(".pout").style.height=Math.ceil(782*s+4)+"px";
  document.getElementById("snote").textContent=`Preview ${Math.round(s*100)}% · Export = 1568×782px`;
}
async function doExport(){
  const btn=document.getElementById("xbtn");
  btn.disabled=true;btn.textContent="Exporting...";
  if(!window.html2canvas){await new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  const sc=document.getElementById("scaler");
  const pt=sc.style.transform;
  sc.style.transform="scale(1)";document.querySelector(".pout").style.height="782px";
  await new Promise(r=>setTimeout(r,200));
  const cv=await html2canvas(document.getElementById("card"),{scale:2,useCORS:true,allowTaint:true,width:1568,height:782,windowWidth:1568,windowHeight:782,backgroundColor:"rgb(205,206,211)"});
  sc.style.transform=pt;scale();
  const a=document.createElement("a");
  a.download="mls_"+document.getElementById("sval").value+".png";
  a.href=cv.toDataURL("image/png");a.click();
  btn.disabled=false;btn.textContent="↓ Export PNG (1568×782)";
}
build();scale();window.addEventListener("resize",scale);
</script>
